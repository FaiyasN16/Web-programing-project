<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#141426" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Glowing Shield Contour -->
  <path d="M 50 16 
           C 66 16, 78 24, 78 38 
           C 78 58, 62 76, 50 84 
           C 38 76, 22 58, 22 38 
           C 22 24, 34 16, 50 16 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.22" 
        filter="url(#glow)"/>

  <!-- Shield Outline -->
  <path d="M 50 18 
           C 64 18, 75 25, 75 38 
           C 75 56, 60 72, 50 80 
           C 40 72, 25 56, 25 38 
           C 25 25, 36 18, 50 18 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Cipher Orbit Rings / Whisper Nodes -->
  <circle cx="34" cy="34" r="2.5" fill="#22D3EE" opacity="0.8"/>
  <circle cx="66" cy="34" r="2.5" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="50" cy="24" r="2" fill="#A78BFA" opacity="0.9"/>
  <line x1="34" y1="34" x2="50" y2="24" stroke="#22D3EE" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <line x1="66" y1="34" x2="50" y2="24" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

  <!-- Lock Shackle -->
  <path d="M 40 44 
           V 38 
           C 40 32.5, 44.5 28, 50 28 
           C 55.5 28, 60 32.5, 60 38 
           V 44" 
        fill="none" 
        stroke="url(#lockGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="36" y="44" width="28" height="24" rx="6" fill="url(#shieldGrad)" />
  <rect x="37.5" y="45.5" width="25" height="21" rx="4.5" fill="#10101C" />

  <!-- Keyhole & Beam -->
  <circle cx="50" cy="52" r="3.2" fill="#22D3EE" />
  <path d="M 48.5 53.5 L 51.5 53.5 L 52.5 60 L 47.5 60 Z" fill="#22D3EE" />
</svg>
